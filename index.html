<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>買い物メモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E6;
    --paper-line:#E4DAC6;
    --ink:#2B3347;
    --ink-soft:#5B6478;
    --urgent:#B23A2E;
    --urgent-bg:#F6E2DE;
    --soon:#C08A2C;
    --soon-bg:#F7EAD1;
    --ok:#57724F;
    --ok-bg:#E5EBDD;
    --hold:#8A7E96;
    --hold-bg:#EAE3EE;
    --line-dash: repeating-linear-gradient(90deg, var(--paper-line) 0 8px, transparent 8px 16px);
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background: var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 28px;
    color: var(--ink);
    font-family: 'Zen Maru Gothic', sans-serif;
    min-height: 100vh;
    padding-bottom: 90px;
  }
  .wrap{ max-width: 460px; margin: 0 auto; padding: 18px 16px 8px; }
  header.top{
    display:flex; align-items:flex-end; justify-content:space-between;
    padding: 4px 2px 14px;
    border-bottom: 2px solid var(--ink);
  }
  header.top h1{
    font-family:'Shippori Mincho', serif;
    font-size: 22px; font-weight:700; margin:0;
    letter-spacing: 0.06em;
  }
  header.top .date{
    font-family:'Space Mono', monospace;
    font-size: 12px; color: var(--ink-soft);
  }
  .stamp{
    display:inline-block; font-family:'Shippori Mincho',serif; font-weight:700;
    font-size:11px; color: var(--urgent); border:1.5px solid var(--urgent);
    border-radius: 6px; padding:2px 6px; transform: rotate(-4deg);
    letter-spacing:0.1em;
  }
  nav.tabs{
    display:flex; gap:6px; margin: 14px 0 16px;
  }
  nav.tabs button{
    flex:1; padding:9px 4px; font-family:'Zen Maru Gothic',sans-serif; font-weight:700;
    font-size:13px; border-radius: 999px; border:1.5px solid var(--ink);
    background: transparent; color: var(--ink); cursor:pointer;
  }
  nav.tabs button.active{ background: var(--ink); color: var(--paper); }

  .card{
    background: #FFFDF8;
    border:1.5px solid var(--ink);
    border-radius: var(--radius);
    padding: 14px 14px 12px;
    margin-bottom: 14px;
    box-shadow: 3px 3px 0 rgba(43,51,71,0.12);
  }
  .card h2{
    font-family:'Shippori Mincho',serif; font-size:15px; margin:0 0 2px;
    display:flex; align-items:center; gap:6px;
  }
  .card .sub{ font-size:11px; color: var(--ink-soft); margin:0 0 10px; }
  .badge{ font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px; }
  .badge.urgent{ background:var(--urgent-bg); color:var(--urgent); }
  .badge.soon{ background:var(--soon-bg); color:var(--soon); }
  .badge.ok{ background:var(--ok-bg); color:var(--ok); }
  .badge.hold{ background:var(--hold-bg); color:var(--hold); }

  .item{
    display:flex; align-items:center; gap:10px;
    padding: 9px 0;
    background-image: var(--line-dash);
    background-position: bottom;
    background-repeat: no-repeat;
    background-size: 100% 1px;
  }
  .item:last-child{ background-image:none; }
  .item input[type=checkbox]{
    width:20px; height:20px; accent-color: var(--ink); flex:none;
  }
  .item .name{ flex:1; min-width:0; }
  .item .name b{ font-size:14px; display:block; }
  .item .name span.note{ font-size:11px; color: var(--ink-soft); }
  .item .qty{
    display:flex; align-items:center; gap:4px; flex:none;
  }
  .item .qty input{
    width:52px; font-family:'Space Mono',monospace; font-size:14px;
    border:1.5px solid var(--paper-line); border-radius:8px; padding:5px 4px; text-align:center;
    background:#fff;
  }
  .item .qty .unit{ font-size:11px; color: var(--ink-soft); width:28px; }
  .plain-row{ padding:7px 0; font-size:13px; display:flex; justify-content:space-between; color:var(--ink-soft); }
  .plain-row b{ color: var(--ink); font-weight:500;}
  .empty{ font-size:12px; color: var(--ink-soft); padding: 4px 0 2px; }

  .addrow{ display:flex; gap:6px; margin-top:8px; }
  .addrow input[type=text]{
    flex:1; border:1.5px solid var(--paper-line); border-radius:10px; padding:8px 10px;
    font-family:'Zen Maru Gothic',sans-serif; font-size:13px; background:#fff;
  }
  .addrow button{
    border:1.5px solid var(--ink); background:#fff; border-radius:10px; padding:0 14px;
    font-weight:700; color:var(--ink); font-size:13px;
  }

  details.collapse summary{ font-size:12px; color: var(--ink-soft); cursor:pointer; padding:4px 0; }

  .fixed-bottom{
    position: fixed; left:0; right:0; bottom:0;
    background: linear-gradient(to top, var(--paper) 60%, transparent);
    padding: 18px 16px 16px;
  }
  .fixed-bottom .inner{ max-width:460px; margin:0 auto; }
  .btn-primary{
    width:100%; padding:14px; border-radius:14px; border:none;
    background: var(--ink); color: var(--paper); font-weight:700; font-size:15px;
    font-family:'Zen Maru Gothic',sans-serif;
    box-shadow: 0 3px 0 rgba(0,0,0,0.25);
  }
  .btn-primary:active{ transform: translateY(2px); box-shadow:none; }
  .btn-primary:disabled{ opacity:0.4; }

  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    background: var(--ink); color: var(--paper); padding:9px 16px; border-radius:10px;
    font-size:13px; z-index:50; opacity:0; transition: opacity .25s;
    pointer-events:none;
  }
  .toast.show{ opacity:1; }

  .invrow{ padding:9px 0; display:flex; align-items:center; gap:8px; background-image: var(--line-dash); background-position:bottom; background-repeat:no-repeat; background-size:100% 1px;}
  .invrow:last-child{ background-image:none; }
  .invrow .n{ flex:1; }
  .invrow .n b{ font-size:13.5px; display:block; }
  .invrow .n span{ font-size:11px; color:var(--ink-soft); }
  .invrow .q{ font-family:'Space Mono',monospace; font-size:13px; flex:none; text-align:right; min-width:70px; }
  .invrow button.edit{
    border:1px solid var(--paper-line); background:#fff; border-radius:8px; font-size:11px; padding:4px 8px; color:var(--ink-soft);
  }
  .edit-form{ display:flex; gap:6px; margin-top:6px; }
  .edit-form input{ width:70px; border:1.5px solid var(--paper-line); border-radius:8px; padding:5px; font-family:'Space Mono',monospace; text-align:center;}
  .edit-form button{ border:1.5px solid var(--ink); background:var(--ink); color:var(--paper); border-radius:8px; padding:5px 10px; font-size:12px; font-weight:700;}

  .loglist .logrow{ padding:8px 0; background-image: var(--line-dash); background-position:bottom; background-repeat:no-repeat; background-size:100% 1px; font-size:12.5px;}
  .loglist .logrow:last-child{ background-image:none; }
  .loglist .logrow .d{ font-family:'Space Mono',monospace; color:var(--ink-soft); font-size:11px; }
  .footer-small{ text-align:center; font-size:11px; color:var(--ink-soft); margin: 6px 0 30px; }
  .footer-small button{ background:none; border:none; color:var(--ink-soft); text-decoration:underline; font-size:11px; margin: 0 6px; }
  .warnbar{
    background: var(--urgent-bg); color: var(--urgent); border:1.5px solid var(--urgent);
    border-radius: 10px; padding: 8px 10px; font-size:12px; margin-bottom:14px;
  }
  .backup-box{ display:none; margin-top:8px; }
  .backup-box textarea{
    width:100%; height:90px; font-family:'Space Mono',monospace; font-size:10px;
    border:1.5px solid var(--paper-line); border-radius:8px; padding:6px;
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="fixed-bottom" id="fixedBottom" style="display:none;">
  <div class="inner">
    <button class="btn-primary" id="commitBtn">選択した商品を購入登録する</button>
  </div>

<script>
const todayStr = () => {
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};
const daysBetween = (a,b) => {
  if(!a) return null;
  const d1 = new Date(a+'T00:00:00'), d2 = new Date(b+'T00:00:00');
  return Math.round((d2-d1)/86400000);
};

  ],
  consumptionLog: [
    {date:'2026-08-01', name:'蒟蒻ゼリー', qty:2, unit:'個', note:'7個から5個へ更新'},
    {date:'2026-08-01', name:'冷凍野菜', qty:0.5, unit:'袋', note:'1.5袋から1袋へ更新'},

    {date:'2026-08-01', name:'蒟蒻ゼリー', qty:1, unit:'個', note:'消費記録（5個 → 4個）'},
    {date:'2026-08-01', name:'コカ・コーラプラス', qty:1, unit:'本', note:'消費記録（2本 → 1本）'},
    {date:'2026-08-01', name:'棒付きアイス', qty:1, unit:'本', note:'消費記録（4本 → 3本）'},
    {date:'2026-08-01', name:'コカ・コーラプラス', qty:0.2, unit:'本', note:'消費記録（1本 → 0.8本）'},
    {date:'2026-08-02', name:'コカ・コーラプラス', qty:0.3, unit:'本', note:'消費記録（0.8本 → 0.5本）'},
    {date:'2026-08-02', name:'ヨーグルト', qty:1, unit:'個', note:'消費記録（7個 → 6個）'},
    {date:'2026-08-02', name:'ペヤングソース焼きそば', qty:1, unit:'個', note:'消費記録（2個 → 1個）'},
  ],
};

let state = null;
let tab = 'today';
let checks = {}; // id -> {checked, qty}
let saveFailed = false;
let pendingReset = false;
let pendingDeleteId = null;
let notYetOpen = false;
let pendingRestoreConfirm = false;
let backupBoxOpen = false;
let backupTextValue = '';

const STORAGE_KEY = 'kaimono-memo-v1';

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw === null){ throw new Error('no data yet'); }
    state = JSON.parse(raw);
  }catch(e){
    state = JSON.parse(JSON.stringify(SEED));
    await saveState();
  }
}
async function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    saveFailed = false;
  }catch(e){
    console.error('保存に失敗しました', e);
    saveFailed = true;
    showToast('保存に失敗しました（下のバックアップ機能をご利用ください）');
  }
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function estimateFor(item){
  if(item.mode !== 'active' || item.confirmedQty==null || item.dailyRate==null || !item.lastConfirmedDate) return null;
  const days = daysBetween(item.lastConfirmedDate, todayStr());
  let est = item.confirmedQty - days*item.dailyRate;
  if(est < 0) est = 0;
  return est;
}

function classify(){
  const buyToday = [];   // 今日買った方がよい
  const buySoon = [];    // 今日買っておくと安心
  const notYet = [];     // まだ買わなくてよい
  const unconfirmed = state.inventory.filter(i=>i.mode==='unconfirmed');

  state.inventory.forEach(item=>{
    if(item.mode === 'unconfirmed') return; // 別枠「要確認」で表示
    if(item.confirmedQty == null) return;

    if(item.mode === 'active' && item.dailyRate!=null && item.lastConfirmedDate){
      // 消費ペースが分かっている商品：推定在庫で判定
      const est = estimateFor(item);
      const daysLeft = item.dailyRate>0 ? est/item.dailyRate : null;
      if(est <= item.buyAt){
        buyToday.push({...item, est, daysLeft});
      } else if(daysLeft!=null && daysLeft <= 3){
        buySoon.push({...item, est, daysLeft});
      } else {
        notYet.push({...item, est, daysLeft});
      }
    } else {
      // 消費ペース未確定の商品：確定在庫が目安（未設定なら1）を下回っていれば「今日買った方がよい」
      const threshold = item.buyAt!=null ? item.buyAt : 1;
      if(item.confirmedQty < threshold){
        buyToday.push({...item, est:item.confirmedQty, daysLeft:null, lowStockRule:true});
      } else {
        notYet.push({...item, est:item.confirmedQty, daysLeft:null});
      }
    }
  });

  return {buyToday, buySoon, notYet, unconfirmed};
}

function ensureCheck(id, defaultQty){
  if(!checks[id]) checks[id] = {checked:false, qty: defaultQty};
  return checks[id];
}

function itemRow(id, name, note, defaultQty, unit, badgeHtml){
  const c = ensureCheck(id, defaultQty);
  return `
  <div class="item">
    <input type="checkbox" data-id="${id}" class="chk" ${c.checked?'checked':''}>
    <div class="name">
      <b>${name} ${badgeHtml||''}</b>
      ${note?`<span class="note">${note}</span>`:''}
    </div>
    <div class="qty">
      <input type="number" step="0.1" min="0" data-id="${id}" class="qtyinput" value="${c.qty}">
      <span class="unit">${unit}</span>
    </div>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  const {buyToday, buySoon, notYet, unconfirmed} = classify();

  let html = `
  <header class="top">
    <h1>買い物メモ</h1>
    <div class="date">${todayStr()}</div>
  </header>`;

  if(saveFailed){
    html += `<div class="warnbar">⚠️ 直近の保存に失敗しています。データが消えないよう、下の「データをコピー」でバックアップを取っておくことをおすすめします。</div>`;
  }

  html += `
  <nav class="tabs">
    <button data-tab="today" class="${tab==='today'?'active':''}">今日</button>
    <button data-tab="inventory" class="${tab==='inventory'?'active':''}">在庫</button>
    <button data-tab="history" class="${tab==='history'?'active':''}">履歴</button>
  </nav>`;

  if(tab==='today'){
    // 買い物リスト
    html += `<div class="card"><h2>🛒 買い物リストの商品</h2><p class="sub">登録済みの買うもの</p>`;
    if(state.shopping.length===0){ html += `<div class="empty">買い物リストは空です</div>`; }
    else state.shopping.forEach(s=>{
      html += itemRow('shop:'+s.id, s.name, s.note, s.plannedQty, s.unit, '');
    });
    html += `
      <div class="addrow">
        <input type="text" id="newItemName" placeholder="買い物リストに追加...">
        <button id="addItemBtn">追加</button>
      </div>
    </div>`;

    // 今日買った方がよい
    html += `<div class="card"><h2>今日買った方がよいもの <span class="badge urgent">至急</span></h2><p class="sub">在庫が目安を下回っています</p>`;
    if(buyToday.length===0){ html += `<div class="empty">対象の商品はありません</div>`; }
    else buyToday.forEach(i=>{
      const note = i.lowStockRule ? `現在庫: 約${i.est}${i.unit}（残り1未満）` : `推定在庫: 約${i.est}${i.unit}`;
      html += itemRow('inv:'+i.id, i.name, note, Math.max(1, Math.ceil((i.dailyRate||1)*3)), i.unit, '');
    });
    html += `</div>`;

    // 今日買っておくと安心
    html += `<div class="card"><h2>今日買っておくと安心なもの <span class="badge soon">まもなく</span></h2><p class="sub">2〜3日以内になくなる見込み</p>`;
    if(buySoon.length===0){ html += `<div class="empty">対象の商品はありません</div>`; }
    else buySoon.forEach(i=>{
      const note = `推定在庫: 約${i.est}${i.unit}（残り約${i.daysLeft?i.daysLeft.toFixed(1):'-'}日）`;
      html += itemRow('inv:'+i.id, i.name, note, Math.max(1, Math.ceil((i.dailyRate||1)*3)), i.unit, '');
    });
    html += `</div>`;

    // 要確認（現物チェック推奨）
    if(unconfirmed.length){
      html += `<div class="card"><h2>要確認 <span class="badge hold">現物チェック推奨</span></h2><p class="sub">確定在庫がないため推定できません。棚を見て在庫タブから確定してください</p>`;
      unconfirmed.forEach(i=>{
        html += `<div class="plain-row"><span>${i.name}</span><b>${i.note||''}</b></div>`;
      });
      html += `</div>`;
    }

    // まだ買わなくてよい
    html += `<div class="card"><details class="collapse" id="notYetDetails" ${notYetOpen?'open':''}><summary>まだ買わなくてよいもの（${notYet.length}件）</summary>`;
    if(notYet.length===0){ html += `<div class="empty">対象の商品はありません</div>`; }
    else notYet.forEach(i=>{
      const desc = i.daysLeft!=null
        ? `推定約${i.est}${i.unit}（残り約${i.daysLeft.toFixed(1)}日）`
        : `現在庫 ${i.est}${i.unit}`;
      html += `
      <div class="item">
        <div class="name"><b>${i.name}</b><span class="note">${desc}</span></div>
        <div class="qty">
          <input type="number" step="0.1" min="0" data-notyetid="${i.id}" class="notyetinput" value="${i.confirmedQty}">
          <span class="unit">${i.unit}</span>
        </div>
      </div>`;
    });
    html += `</details></div>`;
  }

  if(tab==='inventory'){
    html += `<div class="card"><h2>📦 在庫一覧</h2><p class="sub">「食べた/使った」で消費数を記録、「棚卸し」で現物の総数に直接修正できます</p>`;
    state.inventory.forEach(i=>{
      const qtyText = i.confirmedQty==null ? '要確認' : `${i.confirmedQty}${i.unit}`;
      if(pendingDeleteId === i.id){
        html += `
        <div class="invrow">
          <div class="n"><b style="color:var(--urgent);">${i.name} を削除しますか？</b><span>この操作は取り消せません</span></div>
          <button class="edit" data-deleteconfirmid="${i.id}" style="color:var(--urgent); font-weight:700; border-color:var(--urgent);">はい、削除する</button>
          <button class="edit" data-deletecancelid="${i.id}">キャンセル</button>
        </div>`;
        return;
      }
      html += `
      <div class="invrow">
        <div class="n"><b>${i.name}</b><span>${i.note||''}${i.lastConfirmedDate?' ・最終確認 '+i.lastConfirmedDate:''}</span></div>
        <div class="q">${qtyText}</div>
        <button class="edit" data-consumeid="${i.id}">食べた/使った</button>
        <button class="edit" data-foundid="${i.id}">在庫を発見</button>
        <button class="edit" data-editid="${i.id}">棚卸し</button>
        <button class="edit" data-infoeditid="${i.id}">商品名/単位を編集</button>
        <button class="edit" data-deleteid="${i.id}" style="color:var(--urgent);">削除</button>
      </div>
      <div class="edit-form" id="consume-${i.id}" style="display:none;">
        <input type="number" step="0.1" min="0" id="consumeval-${i.id}" placeholder="消費した数">
        <button data-consumesaveid="${i.id}">記録</button>
      </div>
      <div class="edit-form" id="found-${i.id}" style="display:none;">
        <input type="number" step="0.1" min="0" id="foundval-${i.id}" placeholder="見つかった数">
        <button data-foundsaveid="${i.id}">追加</button>
      </div>
      <div class="edit-form" id="edit-${i.id}" style="display:none;">
        <input type="number" step="0.1" min="0" id="editval-${i.id}" placeholder="現在の総数(${i.unit})">
        <button data-saveid="${i.id}">保存</button>
      </div>
      <div class="edit-form" id="infoedit-${i.id}" style="display:none;">
        <input type="text" id="infonameval-${i.id}" value="${i.name}" placeholder="商品名" style="flex:1.2;">
        <input type="text" id="infounitval-${i.id}" value="${i.unit}" placeholder="単位(個/袋/本等)" style="width:70px;">
        <button data-infosaveid="${i.id}">保存</button>
      </div>`;
    });
    html += `
      <div class="addrow" style="margin-top:12px;">
        <input type="text" id="newInvName" placeholder="商品名" style="flex:1.4;">
        <input type="text" id="newInvUnit" placeholder="単位(個/本等)" style="flex:0.7;">
        <input type="number" step="0.1" min="0" id="newInvQty" placeholder="数量" style="flex:0.6;">
      </div>
      <div class="addrow">
        <input type="text" id="newInvNote" placeholder="メモ（任意）">
        <button id="addInvBtn">在庫に追加</button>
      </div>`;
    html += `</div>`;
  }

  if(tab==='history'){
    html += `<div class="card"><h2>🧾 購入履歴</h2><div class="loglist">`;
    if(state.purchaseLog.length===0) html += `<div class="empty">まだ記録がありません</div>`;
    else [...state.purchaseLog].reverse().slice(0,30).forEach(l=>{
      html += `<div class="logrow"><span class="d">${l.date}</span> — <b>${l.name}</b> ${l.qty}${l.unit} ${l.note?'（'+l.note+'）':''}</div>`;
    });
    html += `</div></div>`;

    html += `<div class="card"><h2>📉 在庫調整・消費履歴</h2><div class="loglist">`;
    if(state.consumptionLog.length===0) html += `<div class="empty">まだ記録がありません</div>`;
    else [...state.consumptionLog].reverse().slice(0,30).forEach(l=>{
      html += `<div class="logrow"><span class="d">${l.date}</span> — <b>${l.name}</b> ${l.qty}${l.unit} ${l.note?'（'+l.note+'）':''}</div>`;
    });
    html += `</div></div>`;
  }

  html += `<div class="footer-small">
    ${pendingReset
      ? `<span style="color:var(--urgent);">本当にリセットしますか？</span> <button id="resetConfirmBtn" style="color:var(--urgent); font-weight:700;">はい、リセットする</button> <button id="resetCancelBtn">キャンセル</button>`
      : `<button id="resetBtn">初期データにリセットする</button>`
    }
    ｜
    <button id="backupBtn">データを一発コピー</button>
    <button id="pasteBtn">クリップボードから貼り付け</button>
    <button id="restoreBtn">手動で貼り付け欄を開く</button>
    <div class="backup-box" id="backupBox" style="display:${backupBoxOpen?'block':'none'};">
      <textarea id="backupText" placeholder="ここにバックアップ用テキストを貼り付けてください"></textarea>
      <button id="restoreConfirmBtn" style="width:100%; margin-top:6px; padding:8px; border-radius:8px; border:1.5px solid var(--ink); background:${pendingRestoreConfirm?'var(--urgent-bg)':'#fff'}; font-size:12px; ${pendingRestoreConfirm?'color:var(--urgent); font-weight:700;':''}">${pendingRestoreConfirm ? 'もう一度押すと上書きされます（確定）' : 'この内容で復元する'}</button>
      ${pendingRestoreConfirm ? `<button id="restoreCancelBtn" style="width:100%; margin-top:4px; padding:6px; border-radius:8px; border:1px solid var(--paper-line); background:#fff; font-size:11px;">キャンセル</button>` : ''}
    </div>
  </div>`;

  app.innerHTML = html;
  bindEvents();
  updateBottomBar();
  if(backupBoxOpen){
    const ta = document.getElementById('backupText');
    if(ta) ta.value = backupTextValue;
  }
}

function updateBottomBar(){
  const anyChecked = Object.values(checks).some(c=>c.checked);
  document.getElementById('fixedBottom').style.display = (tab==='today' && anyChecked) ? 'block' : 'none';
}

function bindEvents(){
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.onclick = ()=>{ tab = b.dataset.tab; render(); };
  });

  document.querySelectorAll('.chk').forEach(el=>{
    el.onchange = ()=>{
      const id = el.dataset.id;
      ensureCheck(id).checked = el.checked;
      updateBottomBar();
    };
  });
  document.querySelectorAll('.qtyinput').forEach(el=>{
    el.oninput = ()=>{
      const id = el.dataset.id;
      ensureCheck(id).qty = parseFloat(el.value)||0;
    };
  });

  const addBtn = document.getElementById('addItemBtn');
  if(addBtn) addBtn.onclick = async ()=>{
    const input = document.getElementById('newItemName');
    const name = input.value.trim();
    if(!name) return;
    state.shopping.push({id:'s'+Date.now(), name, plannedQty:1, unit:'', note:''});
    await saveState();
    render();
    showToast('買い物リストに追加しました');
  };

  const addInvBtn = document.getElementById('addInvBtn');
  if(addInvBtn) addInvBtn.onclick = async ()=>{
    const name = document.getElementById('newInvName').value.trim();
    const unit = document.getElementById('newInvUnit').value.trim();
    const qty = parseFloat(document.getElementById('newInvQty').value);
    const note = document.getElementById('newInvNote').value.trim();
    if(!name){ showToast('商品名を入力してください'); return; }
    if(isNaN(qty)){ showToast('数量を入力してください'); return; }
    const newItem = {
      id: 'inv'+Date.now(), name, unit: unit||'', confirmedQty: qty,
      dailyRate: null, buyAt: null, mode: 'excluded',
      lastConfirmedDate: todayStr(), note: note || '新規登録・消費ペース未確定'
    };
    state.inventory.push(newItem);
    state.consumptionLog.push({date: todayStr(), name, qty, unit: unit||'', note:'在庫調整（新規登録）'});
    await saveState();
    render();
    showToast(name+'を在庫に追加しました');
  };

  document.querySelectorAll('[data-infoeditid]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.infoeditid;
      const form = document.getElementById('infoedit-'+id);
      form.style.display = form.style.display==='none' ? 'flex' : 'none';
    };
  });
  document.querySelectorAll('[data-infosaveid]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.dataset.infosaveid;
      const newName = document.getElementById('infonameval-'+id).value.trim();
      const newUnit = document.getElementById('infounitval-'+id).value.trim();
      if(!newName){ showToast('商品名を入力してください'); return; }
      const item = state.inventory.find(i=>i.id===id);
      const prevName = item.name, prevUnit = item.unit;
      item.name = newName;
      item.unit = newUnit;
      if(prevName !== newName || prevUnit !== newUnit){
        state.consumptionLog.push({date: todayStr(), name:newName, qty:null, unit:newUnit, note:`商品情報を編集（${prevName}/${prevUnit} → ${newName}/${newUnit}）`});
      }
      await saveState();
      render();
      showToast('商品情報を更新しました');
    };
  });

  document.querySelectorAll('[data-deleteid]').forEach(el=>{
    el.onclick = ()=>{ pendingDeleteId = el.dataset.deleteid; render(); };
  });
  document.querySelectorAll('[data-deletecancelid]').forEach(el=>{
    el.onclick = ()=>{ pendingDeleteId = null; render(); };
  });
  document.querySelectorAll('[data-deleteconfirmid]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.dataset.deleteconfirmid;
      const item = state.inventory.find(i=>i.id===id);
      if(item){
        state.inventory = state.inventory.filter(i=>i.id!==id);
        state.consumptionLog.push({date: todayStr(), name:item.name, qty:null, unit:item.unit, note:'在庫から削除（商品ごと削除）'});
      }
      pendingDeleteId = null;
      await saveState();
      render();
      showToast(item ? item.name+'を在庫から削除しました' : '削除しました');
    };
  });

  document.querySelectorAll('[data-editid]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.editid;
      const form = document.getElementById('edit-'+id);
      form.style.display = form.style.display==='none' ? 'flex' : 'none';
    };
  });
  document.querySelectorAll('[data-saveid]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.dataset.saveid;
      const val = parseFloat(document.getElementById('editval-'+id).value);
      if(isNaN(val)) return;
      const item = state.inventory.find(i=>i.id===id);
      const prevText = item.confirmedQty==null ? '要確認' : item.confirmedQty+item.unit;
      item.confirmedQty = val;
      item.lastConfirmedDate = todayStr();
      if(item.mode==='unconfirmed') item.mode='active';
      state.consumptionLog.push({date: todayStr(), name:item.name, qty: val, unit:item.unit, note:`在庫調整（${prevText} → ${val}${item.unit}）`});
      await saveState();
      render();
      showToast(item.name+'の在庫を更新しました');
    };
  });

  document.querySelectorAll('[data-foundid]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.foundid;
      const form = document.getElementById('found-'+id);
      form.style.display = form.style.display==='none' ? 'flex' : 'none';
    };
  });
  document.querySelectorAll('[data-foundsaveid]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.dataset.foundsaveid;
      const found = parseFloat(document.getElementById('foundval-'+id).value);
      if(isNaN(found) || found<=0) return;
      const item = state.inventory.find(i=>i.id===id);
      const prevQty = item.confirmedQty;
      const prevText = prevQty==null ? '要確認' : prevQty+item.unit;
      const newQty = (prevQty==null ? 0 : prevQty) + found;
      item.confirmedQty = newQty;
      item.lastConfirmedDate = todayStr();
      if(item.mode==='unconfirmed') item.mode='active';
      state.consumptionLog.push({date: todayStr(), name:item.name, qty: found, unit:item.unit, note:`在庫調整（発見・追加）（${prevText} → ${newQty}${item.unit}）`});
      await saveState();
      render();
      showToast(item.name+'の在庫に'+found+item.unit+'を追加しました');
    };
  });

  const notYetDetails = document.getElementById('notYetDetails');
  if(notYetDetails) notYetDetails.addEventListener('toggle', ()=>{ notYetOpen = notYetDetails.open; });

  document.querySelectorAll('.notyetinput').forEach(el=>{
    el.onchange = async ()=>{
      const id = el.dataset.notyetid;
      const val = parseFloat(el.value);
      if(isNaN(val) || val<0) return;
      const item = state.inventory.find(i=>i.id===id);
      const prevQty = item.confirmedQty;
      item.confirmedQty = val;
      item.lastConfirmedDate = todayStr();
      state.consumptionLog.push({date: todayStr(), name:item.name, qty: val, unit:item.unit, note:`在庫調整（${prevQty}${item.unit} → ${val}${item.unit}）・一覧から更新`});
      await saveState();
      render();
      showToast(item.name+'の在庫を更新しました');
    };
  });

  document.querySelectorAll('[data-consumeid]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.consumeid;
      const form = document.getElementById('consume-'+id);
      form.style.display = form.style.display==='none' ? 'flex' : 'none';
    };
  });
  document.querySelectorAll('[data-consumesaveid]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.dataset.consumesaveid;
      const used = parseFloat(document.getElementById('consumeval-'+id).value);
      if(isNaN(used) || used<=0) return;
      const item = state.inventory.find(i=>i.id===id);
      const prevQty = item.confirmedQty;
      let newQty;
      if(prevQty==null){
        // 確定在庫が不明な場合は消費量だけ記録し、在庫は0未満にしない前提で据え置く
        newQty = null;
      } else {
        newQty = prevQty - used;
        if(newQty < 0) newQty = 0;
        item.confirmedQty = newQty;
        item.lastConfirmedDate = todayStr();
        if(item.mode==='unconfirmed') item.mode='active';
      }
      const prevText = prevQty==null ? '要確認' : prevQty+item.unit;
      const afterText = newQty==null ? '要確認（消費量のみ記録）' : newQty+item.unit;
      state.consumptionLog.push({date: todayStr(), name:item.name, qty: used, unit:item.unit, note:`消費記録（${prevText} → ${afterText}）`});
      await saveState();
      render();
      showToast(item.name+'を'+used+item.unit+'消費として記録しました');
    };
  });

  const resetBtn = document.getElementById('resetBtn');
  if(resetBtn) resetBtn.onclick = ()=>{ pendingReset = true; render(); };
  const resetCancelBtn = document.getElementById('resetCancelBtn');
  if(resetCancelBtn) resetCancelBtn.onclick = ()=>{ pendingReset = false; render(); };
  const resetConfirmBtn = document.getElementById('resetConfirmBtn');
  if(resetConfirmBtn) resetConfirmBtn.onclick = async ()=>{
    state = JSON.parse(JSON.stringify(SEED));
    checks = {};
    pendingReset = false;
    await saveState();
    render();
    showToast('初期データにリセットしました');
  };

  const backupBtn = document.getElementById('backupBtn');
  if(backupBtn) backupBtn.onclick = async ()=>{
    const text = JSON.stringify(state); // 在庫・買い物リスト・購入履歴・消費履歴をまとめて1つのデータとしてコピー
    let copied = false;
    try{
      await navigator.clipboard.writeText(text);
      copied = true;
    }catch(e){ copied = false; }
    if(!copied){
      // クリップボードAPIが使えない環境向けの一発コピー（手動選択不要）
      try{
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        copied = document.execCommand('copy');
        document.body.removeChild(ta);
      }catch(e){ copied = false; }
    }
    if(copied){
      showToast('全データ（買い物リスト・在庫・履歴）をまとめてコピーしました');
    } else {
      backupBoxOpen = true;
      backupTextValue = text;
      render();
      const ta2 = document.getElementById('backupText');
      if(ta2) ta2.select();
      showToast('自動コピーできませんでした。下の欄から手動でコピーしてください');
    }
  };

  const restoreBtn = document.getElementById('restoreBtn');
  if(restoreBtn) restoreBtn.onclick = ()=>{
    backupBoxOpen = !backupBoxOpen;
    if(backupBoxOpen){ backupTextValue = ''; }
    pendingRestoreConfirm = false;
    render();
  };

  const pasteBtn = document.getElementById('pasteBtn');
  if(pasteBtn) pasteBtn.onclick = async ()=>{
    try{
      const text = await navigator.clipboard.readText();
      if(!text || !text.trim()){ showToast('クリップボードにデータが見つかりません'); return; }
      JSON.parse(text); // 形式チェック
      backupBoxOpen = true;
      backupTextValue = text;
      pendingRestoreConfirm = true;
      render();
      showToast('クリップボードから読み込みました。内容を確認して確定してください');
    }catch(e){
      showToast('クリップボードから自動で読み込めませんでした。下の欄に手動で貼り付けてください');
      backupBoxOpen = true;
      backupTextValue = '';
      pendingRestoreConfirm = false;
      render();
    }
  };

  const backupTextEl = document.getElementById('backupText');
  if(backupTextEl) backupTextEl.oninput = (e)=>{ backupTextValue = e.target.value; };

  const restoreConfirmBtn = document.getElementById('restoreConfirmBtn');
  if(restoreConfirmBtn){
    restoreConfirmBtn.onclick = async ()=>{
      const text = (document.getElementById('backupText').value || '').trim();
      if(!text) return;
      if(!pendingRestoreConfirm){
        try{ JSON.parse(text); }
        catch(e){ showToast('貼り付けた内容がJSONとして読み取れません'); return; }
        backupTextValue = text;
        pendingRestoreConfirm = true;
        render();
        return;
      }
      try{
        const parsed = JSON.parse(text);
        state = parsed;
        checks = {};
        pendingRestoreConfirm = false;
        backupBoxOpen = false;
        await saveState();
        render();
        showToast('データを復元しました');
      }catch(e){
        pendingRestoreConfirm = false;
        showToast('復元に失敗しました。貼り付けた内容が正しいか確認してください');
        render();
      }
    };
  }
  const restoreCancelBtn = document.getElementById('restoreCancelBtn');
  if(restoreCancelBtn) restoreCancelBtn.onclick = ()=>{ pendingRestoreConfirm = false; render(); };

  const commitBtn = document.getElementById('commitBtn');
  if(commitBtn) commitBtn.onclick = commitPurchases;
}

async function commitPurchases(){
  const today = todayStr();
  let count = 0;
  for(const [key, c] of Object.entries(checks)){
    if(!c.checked || !c.qty) continue;
    const [kind, id] = key.split(':');
    if(kind==='shop'){
      const s = state.shopping.find(x=>x.id===id);
      if(!s) continue;
      state.purchaseLog.push({date:today, name:s.name, qty:c.qty, unit:s.unit, note:''});
      // 在庫に反映：既存の在庫があれば加算、無ければ新規に在庫として登録する
      const inv = state.inventory.find(i=>i.name===s.name);
      if(inv){
        inv.confirmedQty = (inv.confirmedQty==null ? 0 : inv.confirmedQty) + c.qty;
        inv.lastConfirmedDate = today;
        if(inv.mode==='unconfirmed') inv.mode='active';
      } else {
        state.inventory.push({
          id: 'inv'+Date.now()+Math.floor(Math.random()*1000),
          name: s.name, unit: s.unit || '',
          confirmedQty: c.qty, dailyRate: null, buyAt: null, mode: 'excluded',
          lastConfirmedDate: today, note: '買い物リストからの購入で新規登録・消費ペース未確定'
        });
      }
      state.shopping = state.shopping.filter(x=>x.id!==id);
      count++;
    } else if(kind==='inv'){
      const inv = state.inventory.find(i=>i.id===id);
      if(!inv) continue;
      state.purchaseLog.push({date:today, name:inv.name, qty:c.qty, unit:inv.unit, note:''});
      if(inv.confirmedQty==null) inv.confirmedQty = c.qty;
      else inv.confirmedQty += c.qty;
      inv.lastConfirmedDate = today;
      if(inv.mode==='unconfirmed') inv.mode='active';
      count++;
    }
  }
  checks = {};
  await saveState();
  render();
  showToast(count+'件の購入を登録しました');
}

(async function init(){
  await loadState();
  render();
})();
</script>
</body>
</html>
